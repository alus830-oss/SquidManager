name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get JUCE and oolib (submodules)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Configure
        run: cmake -B cmake_build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: |
          if cmake --build cmake_build --config Release -- -quiet GCC_WARN_INHIBIT_ALL_WARNINGS=YES > build.log 2>&1; then
            echo "BUILD OK"
          else
            echo "=================== ERRORS ==================="
            grep -n -E "error:|BUILD FAILED|The following build commands failed" -A 3 build.log | head -150
            echo "================ LAST 60 LINES ================"
            tail -60 build.log
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package
        run: |
          cd cmake_build/SquidManager_artefacts/Release
          ditto -c -k --keepParent SquidSingle.app "$GITHUB_WORKSPACE/SquidSingle-mac.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SquidSingle-mac
          path: SquidSingle-mac.zip
